name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Unit Tests, Integration Tests & Security Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: collegebus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Monorepo Typecheck
        run: pnpm typecheck

      - name: Linter & Prettier Check
        run: pnpm lint

      - name: Unit Tests
        run: pnpm test:unit

      - name: Integration Tests (Real Database PostGIS, RLS Isolation, Audit Trigger & Migrations)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collegebus_test
        run: pnpm test:int

      - name: Verify No Mock / Synthetic Data Leakage (R-M1, R-M6)
        run: pnpm verify:no-mock

      - name: Verify Route Authorization Inventory (Default-Deny)
        run: pnpm verify:routes-auth

      - name: Verify Expand-Only Migration Policy (P0-T5)
        run: npx tsx scripts/check-migrations.ts
